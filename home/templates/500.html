{% extends "home/base.html" %}

{% block content %}
<div class="main-wrapper-abono">
    <div class="card-abono border-danger"> <div class="header-abono">
            <div class="icon-circle" style="background: linear-gradient(135deg, #dc3545, #ff4d4d);">
                <i class="fas fa-server"></i>
            </div>
            <h3 class="title-abono">Error del Servidor</h3>
            <span class="badge-empeno">Error #500</span>
        </div>

        <div class="body-abono">
            <div class="info-resumen-abono">
                <div class="info-row">
                    <span class="info-label">SISTEMA</span>
                    <span class="info-value">DIAMANTE AZUL SAS</span>
                </div>
                <div class="info-row">
                    <span class="info-label">DIAGNÓSTICO</span>
                    <span class="info-value saldo-rojo">FALLO INTERNO</span>
                </div>
            </div>

            <hr class="divider-abono">

            <p class="text-center" style="font-size: 14px; color: #9ca3af; margin-bottom: 25px;">
                Ocurrió un error inesperado al procesar tu solicitud. 
                El equipo técnico ha sido notificado automáticamente.
            </p>

            <div class="actions-abono">
                <a href="{% url 'usuarios:dashboard' %}" class="btn-primary-abono text-decoration-none" style="background: #374151;">
                    Regresar al Panel <i class="fas fa-home"></i>
                </a>
                <button onclick="location.reload()" class="btn-primary-abono text-decoration-none" style="cursor: pointer;">
                    <i class="fas fa-sync"></i> Reintentar Operación
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Reutilizamos tus estilos de abono_empeno.html */
    .main-wrapper-abono {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        min-height: 80vh;
        padding: 40px 20px;
    }

    .card-abono {
        background: #111827;
        width: 100%;
        max-width: 420px;
        border-radius: 24px;
        padding: 40px 35px 35px 35px;
        border: 1px solid #ef444433; /* Un borde rojo muy tenue */
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        color: #f3f4f6;
    }

    .header-abono { text-align: center; margin-bottom: 30px; }

    .icon-circle {
        width: 55px;
        height: 55px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 22px;
        color: white;
        box-shadow: 0 10px 15px -3px rgba(220, 53, 69, 0.3);
    }

    /* ... (resto de tus estilos de abono_empeno.html) */
    .title-abono { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
    .badge-empeno { display: inline-block; background: #1f2937; color: #9ca3af; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .info-resumen-abono { background: #1f2937; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .info-label { font-size: 10px; color: #9ca3af; font-weight: 800; }
    .info-value { font-size: 14px; font-weight: 600; }
    .saldo-rojo { color: #ef4444; font-size: 16px; }
    .divider-abono { border: 0; border-top: 1px solid #374151; margin: 25px 0; }
    .actions-abono { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .btn-primary-abono { color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary-abono:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-link-abono { text-align: center; color: #9ca3af; text-decoration: none; font-size: 13px; }
</style>
{% endblock %}
